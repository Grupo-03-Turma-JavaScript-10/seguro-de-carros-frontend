<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fundo -->
  <circle cx="50" cy="50" r="50" fill="#000000"/>
  
  <!-- Carro -->
  <g transform="translate(50, 50)">
    <!-- Corpo do carro -->
    <path d="M -20 -5 L -15 -15 L 15 -15 L 20 -5 L 20 10 L -20 10 Z" fill="#e24f10" stroke="#e24f10" stroke-width="1"/>
    
    <!-- Teto/cabine -->
    <path d="M -10 -5 L -8 -12 L 8 -12 L 10 -5 Z" fill="#e24f10" stroke="#e24f10" stroke-width="1"/>
    
    <!-- Roda esquerda -->
    <circle cx="-12" cy="12" r="5" fill="#333333" stroke="#e24f10" stroke-width="1.5"/>
    <circle cx="-12" cy="12" r="2.5" fill="#666666"/>
    
    <!-- Roda direita -->
    <circle cx="12" cy="12" r="5" fill="#333333" stroke="#e24f10" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="2.5" fill="#666666"/>
    
    <!-- Janelas -->
    <rect x="-8" y="-10" width="6" height="4" fill="#1a1a1a" opacity="0.7"/>
    <rect x="2" y="-10" width="6" height="4" fill="#1a1a1a" opacity="0.7"/>
  </g>
</svg>